<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Template Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #ddd9d2;
    --accent: #2d5a27;
    --accent2: #4a7c43;
    --accent-light: #e8f0e7;
    --text: #1a1a18;
    --text2: #5a574f;
    --text3: #8a877f;
    --danger: #8b2e2e;
    --danger-light: #fdf0f0;
    --success: #2d5a27;
    --success-light: #e8f0e7;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --font: 'Sora', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    background: var(--accent);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.18);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-icon {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.18);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .header p { font-size: 12px; opacity: 0.7; margin-top: 1px; }
  .header-actions { display: flex; gap: 8px; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 24px 28px;
    max-width: 1300px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ── Panels ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .panel-body { padding: 20px; }

  /* ── Form ── */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .form-label span {
    font-size: 10px;
    color: var(--text3);
    font-weight: 400;
    margin-left: 4px;
  }

  input[type=text], textarea, select {
    width: 100%;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(74,124,67,0.12);
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .fmt-btn {
    padding: 3px 8px;
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    color: var(--text);
    line-height: 1.4;
    transition: all 0.1s;
    font-family: var(--font);
  }
  .fmt-btn:hover { background: var(--accent-light); border-color: var(--accent2); color: var(--accent); }
  .fmt-btn:active { transform: scale(0.95); }

  /* greeting pills */
  .greeting-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .g-pill {
    padding: 6px 14px;
    font-size: 13px;
    font-family: var(--font);
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 400;
  }
  .g-pill:hover { border-color: var(--accent2); color: var(--accent); }
  .g-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  /* custom fields */
  .custom-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .custom-row {
    display: grid;
    grid-template-columns: 1fr 1fr 32px;
    gap: 6px;
    align-items: center;
  }
  .custom-row input { font-size: 13px; padding: 7px 10px; }
  .remove-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .remove-btn:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }

  /* tags */
  .tag-bar { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.1s;
  }
  .tag:hover { border-color: var(--accent2); }

  /* buttons */
  .btn {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .btn-outline:hover { background: var(--surface2); }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: none;
    padding: 7px 12px;
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-sm { font-size: 12px; padding: 6px 13px; }
  .btn-success {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }
  .btn-success:hover { opacity: 0.88; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

  /* output */
  .output-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    min-height: 120px;
    font-family: var(--font);
    position: relative;
  }
  .output-placeholder { color: var(--text3); font-style: italic; font-size: 13px; }

  .copy-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--success);
    color: #fff;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .copy-badge.show { opacity: 1; }

  /* log table */
  .log-wrap { overflow-x: auto; }
  .log-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .log-table th {
    text-align: left;
    padding: 9px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .log-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: var(--accent-light); }
  .empty-state {
    text-align: center;
    padding: 36px;
    color: var(--text3);
    font-size: 13px;
  }
  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  .badge-count {
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    font-size: 10px;
    padding: 2px 7px;
    font-weight: 600;
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: #fff;
    padding: 11px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    z-index: 9999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--accent); }
  .toast.error { background: var(--danger); }

  /* divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    flex: 1;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .stat-num { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-icon">✉</div>
    <div>
      <h1>Email Template Manager</h1>
      <p>Compose, replace, save — all entries logged to Excel</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.4);" onclick="exportExcel()">
      ⬇ Export Excel
    </button>
    <button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.4);" onclick="clearLog()">
      Clear Log
    </button>
  </div>
</div>

<div class="layout">
  <!-- LEFT: Composer -->
  <div>
    <!-- Template Panel -->
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>Email Body</div>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">Email template <span>— use {placeholders}</span></label>
          <!-- Formatting toolbar -->
          <div id="toolbar" style="display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;">
            <button class="fmt-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
            <button class="fmt-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
            <button class="fmt-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
            <div style="width:1px;background:var(--border);margin:2px 4px;"></div>
            <button class="fmt-btn" onclick="fmt('insertUnorderedList')" title="Bullet list">☰</button>
            <button class="fmt-btn" onclick="fmt('insertOrderedList')" title="Numbered list">1.</button>
            <div style="width:1px;background:var(--border);margin:2px 4px;"></div>
            <button class="fmt-btn" onclick="fmt('justifyLeft')" title="Align left">⬅</button>
            <button class="fmt-btn" onclick="fmt('justifyCenter')" title="Center">↔</button>
            <button class="fmt-btn" onclick="fmt('justifyRight')" title="Align right">➡</button>
            <div style="width:1px;background:var(--border);margin:2px 4px;"></div>
            <select onchange="fmt('fontSize', this.value);this.value=''" style="font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer;">
              <option value="">Size</option>
              <option value="1">Small</option>
              <option value="3">Normal</option>
              <option value="5">Large</option>
              <option value="7">Huge</option>
            </select>
          </div>
          <!-- Editable div instead of textarea -->
          <div id="template" contenteditable="true"
            style="min-height:160px;padding:10px 12px;border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--bg);font-size:14px;line-height:1.7;color:var(--text);outline:none;overflow-y:auto;font-family:var(--font);"
            oninput="onTemplateInput()"
            onfocus="this.style.borderColor='var(--accent2)';this.style.boxShadow='0 0 0 3px rgba(74,124,67,0.12)'"
            onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'">
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          <div class="section-label" style="margin-bottom:0;">Insert placeholder</div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="saveTemplate()" id="save-tpl-btn">💾 Save Template</button>
            <button class="btn btn-ghost btn-sm" onclick="resetTemplate()" title="Restore default template" style="font-size:11px;color:var(--text3);">↩ Reset default</button>
          </div>
        </div>
        <div class="tag-bar" id="tag-bar"></div>
        <div id="tpl-saved-note" style="font-size:11px;color:var(--text3);margin-top:6px;display:none;">✓ Template saved — loads automatically next time.</div>
      </div>    </div>

    <!-- Replacements Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>Replacements</div>
        <button class="btn btn-ghost btn-sm" onclick="addCustomField()">+ Add field</button>
      </div>
      <div class="panel-body">

        <!-- Greeting -->
        <div class="form-group">
          <label class="form-label">Greeting</label>
          <div class="greeting-group" id="greeting-group">
            <button class="g-pill" onclick="pickGreeting(this,'Good morning')">Good morning</button>
            <button class="g-pill" onclick="pickGreeting(this,'Good afternoon')">Good afternoon</button>
            <button class="g-pill" onclick="pickGreeting(this,'Good evening')">Good evening</button>
            <button class="g-pill" onclick="pickGreeting(this,'Hello')">Hello</button>
            <button class="g-pill" onclick="pickGreeting(this,'Hi')">Hi</button>
          </div>
        </div>

        <hr class="divider">

        <!-- Fixed fields -->
        <div class="form-group">
          <label class="form-label">Client Name</label>
          <input type="text" id="f_name" placeholder="e.g. John Smith" oninput="renderTags()" />
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" id="f_address" placeholder="e.g. 123 Main Street, Montreal" oninput="renderTags()" />
        </div>
        <div class="form-group">
          <label class="form-label">Client Email</label>
          <input type="text" id="f_email" placeholder="e.g. john@example.com" />
        </div>

        <hr class="divider">
        <div class="section-label">Custom fields</div>

        <!-- Dynamic fields -->
        <div class="custom-fields" id="custom-fields"></div>

        <div class="btn-row">
          <button class="btn btn-primary" id="generate-btn" onclick="generate()">⚡ Generate Email</button>
          <button class="btn btn-outline" onclick="copyOutput()" id="inline-copy-btn">📋 Copy Email</button>
          <button class="btn btn-ghost" onclick="resetForm()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Output + Log -->
  <div>
    <!-- Output Panel -->
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-header">
        <div class="panel-title"><div class="dot"></div>Generated Email</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="btn btn-ghost btn-sm" onclick="copyOutput()" id="copy-btn">Copy</button>
          <button class="btn btn-success btn-sm" id="send-btn" onclick="sendToClient()">✉ Send to Client</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="output-area" id="output" style="position:relative;">
          <span class="output-placeholder" id="output-placeholder">Your generated email will appear here...</span>
          <div id="output-html" style="display:none;line-height:1.7;font-size:14px;"></div>
          <div class="copy-badge" id="copy-badge">Copied!</div>
        </div>

      </div>
    </div>

    <!-- Log Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <div class="dot"></div>Emails Sent
          <span class="badge-count" id="count-badge">0</span>
        </div>
        <button class="btn btn-outline btn-sm" onclick="exportExcel()">⬇ Export .xlsx</button>
      </div>
      <div class="panel-body" style="padding:0;">
        <div class="stat-row" style="padding:16px 16px 0;">
          <div class="stat-box">
            <div class="stat-num" id="stat-total">0</div>
            <div class="stat-lbl">Total sent</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="stat-today">0</div>
            <div class="stat-lbl">Today</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="stat-clients">0</div>
            <div class="stat-lbl">This week</div>
          </div>
        </div>
        <div class="log-wrap" style="margin-top:14px;">
          <div id="log-container"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──
let greeting = '';
let customFields = [
  { key: 'phone', value: '' }
];
let log = JSON.parse(localStorage.getItem('emailLog') || '[]');
let lastGenerated = '';

// ── Greeting ──
function pickGreeting(el, val) {
  greeting = val;
  document.querySelectorAll('.g-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTags();
}

// ── Custom fields ──
function addCustomField() {
  customFields.push({ key: '', value: '' });
  renderCustomFields();
}
function removeCustomField(i) {
  customFields.splice(i, 1);
  renderCustomFields();
}
function renderCustomFields() {
  const c = document.getElementById('custom-fields');
  c.innerHTML = '';
  customFields.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'custom-row';
    row.innerHTML = `
      <input type="text" placeholder="key (e.g. phone)" value="${f.key}"
        style="font-family:'JetBrains Mono',monospace;font-size:12px;"
        oninput="customFields[${i}].key=this.value;renderTags()" />
      <input type="text" placeholder="value" value="${f.value}"
        oninput="customFields[${i}].value=this.value" />
      <button class="remove-btn" onclick="removeCustomField(${i})" title="Remove">×</button>
    `;
    c.appendChild(row);
  });
  renderTags();
}

// ── Tags ──
function renderTags() {
  const keys = [
    'greeting', 'name', 'address',
    ...customFields.filter(f => f.key).map(f => f.key)
  ];
  const bar = document.getElementById('tag-bar');
  bar.innerHTML = keys.map(k =>
    `<span class="tag" onclick="insertTag('{${k}}')">{${k}}</span>`
  ).join('');
}

function insertTag(tag) {
  const el = document.getElementById('template');
  el.focus();
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(tag));
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    el.innerHTML += tag;
  }
}

// ── Rich text formatting ──
function fmt(cmd, val) {
  document.getElementById('template').focus();
  document.execCommand(cmd, false, val || null);
}

// ── Generate ──
async function generate() {
  let text = document.getElementById('template').innerHTML.trim();
  if (!text || text === '<br>') { showToast('Please enter an email template first.', 'error'); return; }

  text = text.replace(/\{greeting\}/gi, greeting || '{greeting}');
  text = text.replace(/\{name\}/gi, document.getElementById('f_name').value || '{name}');
  text = text.replace(/\{address\}/gi, document.getElementById('f_address').value || '{address}');
  customFields.forEach(f => {
    if (f.key) {
      const re = new RegExp(`\\{${escapeRe(f.key)}\\}`, 'gi');
      text = text.replace(re, f.value || `{${f.key}}`);
    }
  });

  lastGenerated = text;

  // Show HTML output
  document.getElementById('output-placeholder').style.display = 'none';
  const outHtml = document.getElementById('output-html');
  outHtml.style.display = 'block';
  outHtml.innerHTML = text;

  // 1. Copy plain text to clipboard
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = text;
  const plainText = tempDiv.innerText;
  try {
    await navigator.clipboard.writeText(plainText);
    const badge = document.getElementById('copy-badge');
    if (badge) { badge.classList.add('show'); setTimeout(() => badge.classList.remove('show'), 1800); }
  } catch(e) {}

  // 2. Submit client info to Formspree
  const phoneField = customFields.find(f => f.key.toLowerCase() === 'phone');
  const clientData = {
    client_name:  document.getElementById('f_name').value,
    address:      document.getElementById('f_address').value,
    email:        document.getElementById('f_email').value,
    phone:        phoneField ? phoneField.value : '',
  };

  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Submitting...';

  try {
    const res = await fetch('https://formspree.io/f/mbdwddqg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(clientData)
    });
    if (res.ok) {
      showToast('✓ Email copied & client info submitted!', 'success');
    } else {
      showToast('Email copied. Form submit failed — check connection.', 'error');
    }
  } catch(e) {
    showToast('Email copied. Could not reach form endpoint.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '⚡ Generate Email';
}

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Copy ──
function copyOutput() {
  if (!lastGenerated) { showToast('Generate an email first.', 'error'); return; }
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = lastGenerated;
  const plainText = tempDiv.innerText;
  navigator.clipboard.writeText(plainText).then(() => {
    const badge = document.getElementById('copy-badge');
    if (badge) { badge.classList.add('show'); setTimeout(() => badge.classList.remove('show'), 1800); }
    const btn = document.getElementById('inline-copy-btn');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = '📋 Copy Email', 2000); }
    showToast('Copied to clipboard!', 'success');
  });
}

// ── Save entry ──
function saveEntry() {
  if (!lastGenerated) { showToast('Generate an email first.', 'error'); return; }

  const extra = {};
  customFields.forEach(f => { if (f.key) extra[f.key] = f.value; });

  const entry = {
    id: log.length + 1,
    timestamp: new Date().toLocaleString(),
    date: new Date().toLocaleDateString(),
    greeting,
    client_name: document.getElementById('f_name').value,
    address: document.getElementById('f_address').value,
    ...extra,
    email_body: lastGenerated
  };

  log.push(entry);
  localStorage.setItem('emailLog', JSON.stringify(log));
  renderLog();
  showToast('Saved to log! Export Excel to download.', 'success');
}

// ── Render sent log ──
function renderLog() {
  const sentLog = JSON.parse(localStorage.getItem('sentLog') || '[]');
  const container = document.getElementById('log-container');
  document.getElementById('count-badge').textContent = sentLog.length;
  document.getElementById('stat-total').textContent = sentLog.length;

  const today = new Date().toLocaleDateString();
  document.getElementById('stat-today').textContent = sentLog.filter(e => e.date === today).length;

  // This week: Mon–Sun
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0=Sun
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((dayOfWeek + 6) % 7));
  monday.setHours(0,0,0,0);
  const thisWeek = sentLog.filter(e => new Date(e.timestamp) >= monday).length;
  document.getElementById('stat-clients').textContent = thisWeek;

  if (sentLog.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">✉</div>No emails sent yet.<br>Hit Send to Client to get started.</div>`;
    return;
  }

  const recent = [...sentLog].reverse().slice(0, 15);
  container.innerHTML = `<table class="log-table">
    <thead><tr>
      <th>#</th><th>Time</th><th>Client</th><th>To Email</th><th>Address</th><th>Status</th>
    </tr></thead>
    <tbody>${recent.map(e => `<tr>
      <td>${e.id}</td>
      <td>${e.timestamp}</td>
      <td>${e.client_name || '—'}</td>
      <td style="color:var(--accent);">${e.to_email || '—'}</td>
      <td>${e.address || '—'}</td>
      <td><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--success-light);color:var(--success);font-weight:500;">✓ Sent</span></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Export Excel ──
function exportExcel() {
  const sentLog = JSON.parse(localStorage.getItem('sentLog') || '[]');
  if (sentLog.length === 0) { showToast('No sent emails to export yet.', 'error'); return; }

  const wb = XLSX.utils.book_new();

  const rows = sentLog.map(e => ({
    'ID': e.id,
    'Timestamp': e.timestamp,
    'Date': e.date,
    'Client Name': e.client_name,
    'Sent To': e.to_email,
    'Address': e.address,
    'Status': 'Sent'
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 5 }, { wch: 22 }, { wch: 12 }, { wch: 22 }, { wch: 28 }, { wch: 32 }, { wch: 8 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Sent Emails');

  const today = new Date().toLocaleDateString();
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0,0,0,0);
  const summaryData = [
    ['Summary', ''],
    ['Total Emails Sent', sentLog.length],
    ['Sent Today', sentLog.filter(e => e.date === today).length],
    ['Sent This Week', sentLog.filter(e => new Date(e.timestamp) >= monday).length],
    ['Export Date', new Date().toLocaleString()],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(summaryData);
  ws2['!cols'] = [{ wch: 24 }, { wch: 20 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Summary');

  const fname = `sent_emails_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast(`Exported: ${fname}`, 'success');
}

// ── Clear ──
function clearLog() {
  const sentLog = JSON.parse(localStorage.getItem('sentLog') || '[]');
  if (sentLog.length === 0) return;
  if (!confirm('Clear all sent email records? This cannot be undone.')) return;
  localStorage.setItem('sentLog', '[]');
  renderLog();
  showToast('Sent log cleared.');
}

function resetForm() {
  document.getElementById('output-placeholder').style.display = 'block';
  document.getElementById('output-html').style.display = 'none';
  document.getElementById('output-html').innerHTML = '';
  document.getElementById('f_name').value = '';
  document.getElementById('f_address').value = '';
  greeting = '';
  customFields = [{ key: 'phone', value: '' }];
  document.querySelectorAll('.g-pill').forEach(b => b.classList.remove('active'));
  lastGenerated = '';
  document.getElementById('output').innerHTML = '<span class="output-placeholder">Your generated email will appear here...</span><div class="copy-badge" id="copy-badge">Copied!</div>';
  renderCustomFields();
  showToast('Fields cleared — template kept.');
}

// ── Toast ──
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Default template ──
const DEFAULT_TEMPLATE = `{greeting},<br><br>Dear {name},<br><br>We are writing regarding your property at {address}.<br><br>Please do not hesitate to contact us at {phone} at your earliest convenience. We would be happy to assist you with any questions or concerns.<br><br>We look forward to hearing from you.<br><br>Best regards,<br>[Your Name]`;

function saveTemplate() {
  const val = document.getElementById('template').innerHTML;
  localStorage.setItem('savedTemplate', val);
  document.getElementById('tpl-saved-note').style.display = 'block';
  const btn = document.getElementById('save-tpl-btn');
  btn.textContent = '✓ Saved!';
  setTimeout(() => { btn.textContent = '💾 Save Template'; }, 2000);
  showToast('Template saved — loads automatically next time.', 'success');
}

function resetTemplate() {
  document.getElementById('template').innerHTML = DEFAULT_TEMPLATE;
  localStorage.removeItem('savedTemplate');
  document.getElementById('tpl-saved-note').style.display = 'none';
  showToast('Restored to default template.');
}

// ── EmailJS ──
emailjs.init('_XQgHvxruQucYAX9p');

async function sendToClient() {
  if (!lastGenerated) { showToast('Generate an email first.', 'error'); return; }

  const clientEmail = document.getElementById('f_email').value.trim();
  if (!clientEmail) { showToast('Please enter the client email address.', 'error'); return; }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(clientEmail)) { showToast('Please enter a valid client email address.', 'error'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Sending...';

  const phoneField = customFields.find(f => f.key.toLowerCase() === 'phone');

  try {
    const res = await emailjs.send('service_qi3xlts', 'template_v9pra2r', {
      to_email:    clientEmail,
      to_name:     document.getElementById('f_name').value || clientEmail,
      from_name:   '3D Virtual',
      reply_to:    'info@3dvirtual.space',
      subject:     'Enhance your listing at ' + (document.getElementById('f_address').value || '{Address}') + ' | Améliorez votre inscription au ' + (document.getElementById('f_address').value || '{Address}'),
      message:     lastGenerated,  // HTML content — use {{{message}}} in EmailJS template
      client_name: document.getElementById('f_name').value,
      address:     document.getElementById('f_address').value,
      phone:       phoneField ? phoneField.value : '',
    });

    if (res.status === 200) {
      // Record in sent log
      const sentLog = JSON.parse(localStorage.getItem('sentLog') || '[]');
      sentLog.push({
        id:          sentLog.length + 1,
        timestamp:   new Date().toLocaleString(),
        date:        new Date().toLocaleDateString(),
        client_name: document.getElementById('f_name').value,
        to_email:    clientEmail,
        address:     document.getElementById('f_address').value,
      });
      localStorage.setItem('sentLog', JSON.stringify(sentLog));
      renderLog();

      showToast('✓ Email sent to ' + clientEmail + '!', 'success');
      btn.textContent = '✓ Sent!';
      setTimeout(() => { btn.disabled = false; btn.innerHTML = '✉ Send to Client'; }, 3000);
    } else {
      throw new Error('Non-200 status');
    }
  } catch(e) {
    showToast('Failed to send. Check EmailJS template settings.', 'error');
    btn.disabled = false;
    btn.innerHTML = '✉ Send to Client';
  }
}

const savedTpl = localStorage.getItem('savedTemplate');
document.getElementById('template').innerHTML = savedTpl || DEFAULT_TEMPLATE;
if (savedTpl) document.getElementById('tpl-saved-note').style.display = 'block';

let tplTimer;
function onTemplateInput() {
  clearTimeout(tplTimer);
  tplTimer = setTimeout(() => {
    localStorage.setItem('savedTemplate', document.getElementById('template').innerHTML);
  }, 800);
}

renderCustomFields();
renderLog();
